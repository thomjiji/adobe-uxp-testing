<!doctype html>
<html>
  <head>
    <script src="src/main.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <h4>Flatten Folder Structure</h4>
    <sp-body id="progress-text" style="margin: 10px 0; min-height: 40px; display: block;"></sp-body>
    <div class="main-div">
      <sp-body id="plugin-body">
        Select one or more bins in the Project Panel and click "Flatten" to extract clips from deep folders within each selected bin.
      </sp-body>
    </div>
    <footer>
      <sp-button id="scan-btn" variant="accent" title="Move clips from deep folders to the top level of selected bins">Flatten Selected Bins</sp-button>
      <sp-button id="flatten-remove-btn" variant="warning" title="Flatten structure and delete unwanted files like .jpg and .txt">Flatten & Remove</sp-button>
      <sp-button id="clear-btn" title="Clear all messages from the log window">Clear Log</sp-button>
    </footer>
  </body>
</html>
