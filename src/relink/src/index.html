<!doctype html>
<html>
  <head>
    <script src="src/main.js"></script>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <h4>Relink Media</h4>
    
    <div style="margin-bottom: 10px;">
        <div style="display: flex; gap: 8px; margin-bottom: 5px;">
             <sp-button id="select-folder-btn">Select Search Folder</sp-button>
        </div>
        <div id="selected-path-display" style="font-size: 11px; color: #aaaaaa; word-break: break-all; min-height: 1.2em;">
            (No folder selected)
        </div>
    </div>

    <sp-body id="progress-text" style="margin: 10px 0; min-height: 40px; display: block;"></sp-body>
    
    <div class="main-div">
      <sp-body id="plugin-body"></sp-body>
    </div>
    
    <footer>
      <sp-button id="run-btn" variant="accent" disabled>Start Relink</sp-button>
      <sp-button id="clear-btn">Clear Log</sp-button>
    </footer>
  </body>
</html>
